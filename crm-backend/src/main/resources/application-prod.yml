# ═══════════════════════════════════════════════════════════════════════════
# Production Profile Configuration
# All secrets and hosts come from environment variables (see crm-backend/.env.example).
# FRONTEND_URL (e.g. https://your-app.vercel.app) drives CORS, WebSocket origins
# and the OAuth2 / invitation redirects unless the specific variables are set.
# ═══════════════════════════════════════════════════════════════════════════

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # Using update to create missing tables
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  datasource:
    # JDBC form, e.g. jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Small pool: free Postgres tiers and a 512 MB container
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1

logging:
  level:
    root: WARN
    com.arjun.crm: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: ""  # console only; container filesystems are ephemeral

server:
  port: ${SERVER_PORT:${PORT:8080}}
  address: 0.0.0.0
  # Trust X-Forwarded-* from the hosting proxy so {baseUrl} resolves to https
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true

# Only health and info are exposed in production
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# API Documentation disabled in production
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

# Strict CORS for production
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}
  allow-credentials: true

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}}

# OAuth2 redirect after login
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:${FRONTEND_URL}/oauth2/callback}

# Application configuration
app:
  invitation-base-url: ${INVITATION_BASE_URL:${FRONTEND_URL}/invitations}
  oauth2-frontend-failure-url: ${OAUTH2_FRONTEND_FAILURE_URL:${FRONTEND_URL}/login?error=oauth2_failed}
